name: Docker Hub Description

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: drumsergio/quality-gate-encoder
          short-description: "Quality Gate's encoder for Jellyfin: pre-encodes a library into 720p HEVC, H.264 or AV1 versions."
