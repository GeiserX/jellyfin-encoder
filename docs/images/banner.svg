<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B4C9A"/>
      <stop offset="100%" style="stop-color:#00A4DC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>

  <!-- Subtle overlay stripe -->
  <rect x="0" y="0" width="900" height="200" rx="12" fill="url(#accent)"/>

  <!-- Decorative dots pattern (top-right) -->
  <g opacity="0.08" fill="#fff">
    <circle cx="780" cy="30" r="3"/><circle cx="800" cy="30" r="3"/><circle cx="820" cy="30" r="3"/><circle cx="840" cy="30" r="3"/><circle cx="860" cy="30" r="3"/>
    <circle cx="780" cy="50" r="3"/><circle cx="800" cy="50" r="3"/><circle cx="820" cy="50" r="3"/><circle cx="840" cy="50" r="3"/><circle cx="860" cy="50" r="3"/>
    <circle cx="780" cy="70" r="3"/><circle cx="800" cy="70" r="3"/><circle cx="820" cy="70" r="3"/><circle cx="840" cy="70" r="3"/><circle cx="860" cy="70" r="3"/>
    <circle cx="780" cy="90" r="3"/><circle cx="800" cy="90" r="3"/><circle cx="820" cy="90" r="3"/><circle cx="840" cy="90" r="3"/><circle cx="860" cy="90" r="3"/>
  </g>

  <!-- Film/Video icon -->
  <g transform="translate(60, 55)">
    <!-- Film strip body -->
    <rect x="0" y="0" width="80" height="90" rx="6" fill="none" stroke="#fff" stroke-width="3" opacity="0.9"/>
    <!-- Sprocket holes left -->
    <rect x="6" y="8" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="6" y="24" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="6" y="40" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="6" y="56" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="6" y="72" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <!-- Sprocket holes right -->
    <rect x="64" y="8" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="64" y="24" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="64" y="40" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="64" y="56" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="64" y="72" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <!-- Play triangle -->
    <polygon points="30,25 30,65 58,45" fill="#fff" opacity="0.9"/>
    <!-- Arrow indicating encoding/conversion -->
    <g transform="translate(88, 30)">
      <line x1="0" y1="15" x2="28" y2="15" stroke="#fff" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
      <polyline points="20,6 30,15 20,24" fill="none" stroke="#fff" stroke-width="3" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Smaller output frame (720p) -->
    <rect x="120" y="12" width="56" height="66" rx="4" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.8"/>
    <text x="148" y="52" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle" opacity="0.85" font-weight="bold">720p</text>
  </g>

  <!-- Project name -->
  <text x="310" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" fill="#fff" font-weight="700" letter-spacing="-1">
    jellyfin-encoder
  </text>

  <!-- Tagline -->
  <text x="312" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fff" opacity="0.85" font-weight="400">
    Automatic video transcoding for Jellyfin media streaming
  </text>

  <!-- Tag pills -->
  <g transform="translate(310, 145)">
    <rect x="0" y="0" width="62" height="24" rx="12" fill="#fff" opacity="0.15"/>
    <text x="31" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" opacity="0.9">HEVC</text>

    <rect x="72" y="0" width="52" height="24" rx="12" fill="#fff" opacity="0.15"/>
    <text x="98" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" opacity="0.9">AV1</text>

    <rect x="134" y="0" width="72" height="24" rx="12" fill="#fff" opacity="0.15"/>
    <text x="170" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" opacity="0.9">NVENC</text>

    <rect x="216" y="0" width="58" height="24" rx="12" fill="#fff" opacity="0.15"/>
    <text x="245" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" opacity="0.9">QSV</text>

    <rect x="284" y="0" width="68" height="24" rx="12" fill="#fff" opacity="0.15"/>
    <text x="318" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" opacity="0.9">Docker</text>
  </g>
</svg>
